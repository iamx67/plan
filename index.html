<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Домашний фитнес-трекер</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      color-scheme: dark;
      --bg: #080711;
      --card: #14111f;
      --card2: #1b1728;
      --text: #f7f2ff;
      --muted: #aaa0bd;
      --purple: #8b5cf6;
      --purple2: #c084fc;
      --accent: #ec4899;
      --soft: #251d38;
      --soft2: #1c172a;
      --green: #22c55e;
      --yellow: #f59e0b;
      --red: #ef4444;
      --border: #302746;
      --shadow: 0 18px 50px rgba(0, 0, 0, 0.38);
    }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: radial-gradient(circle at top left, rgba(139,92,246,.20) 0, transparent 34%), radial-gradient(circle at bottom right, rgba(236,72,153,.12) 0, transparent 30%), linear-gradient(180deg, #090814, var(--bg));
      color: var(--text);
    }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; border: 0; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 22px; }
    .hero {
      background: linear-gradient(135deg, #7c3aed, #db2777);
      color: white;
      border-radius: 32px;
      padding: 28px;
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.18);
      font-weight: 800;
      font-size: 14px;
    }
    h1 { font-size: clamp(32px, 5vw, 58px); margin: 18px 0 8px; line-height: 1.02; }
    h2 { font-size: 30px; margin: 0; }
    h3 { margin: 0; }
    .hero p { color: rgba(255,255,255,.86); max-width: 760px; line-height: 1.5; }
    .tabs {
      position: sticky;
      top: 10px;
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 18px 0;
      padding: 8px;
      background: rgba(255,255,255,.82);
      backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 24px;
      box-shadow: 0 10px 35px rgba(124,58,237,.10);
    }
    .tab {
      padding: 13px 10px;
      border-radius: 18px;
      font-weight: 900;
      color: #584b70;
      background: transparent;
    }
    .tab.active { background: var(--purple); color: white; }
    .grid { display: grid; gap: 18px; }
    .layout { grid-template-columns: minmax(0, 1fr) 360px; align-items: start; }
    .card {
      background: rgba(255,255,255,.9);
      border: 1px solid var(--border);
      border-radius: 30px;
      padding: 20px;
      box-shadow: var(--shadow);
    }
    .topline { display: flex; gap: 14px; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; }
    .muted { color: var(--muted); }
    .date-input, .field, textarea {
      border: 1px solid var(--border);
      background: #fff;
      border-radius: 16px;
      padding: 12px 14px;
      outline: none;
      width: 100%;
    }
    .date-input { width: auto; font-weight: 800; background: var(--soft2); }
    .stats { grid-template-columns: repeat(3, 1fr); margin: 18px 0; }
    .stat {
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 14px;
    }
    .stat b { font-size: 28px; display: block; margin-top: 4px; }
    .bar { height: 12px; border-radius: 999px; overflow: hidden; background: var(--soft); margin: 12px 0 18px; }
    .bar > div { height: 100%; background: linear-gradient(90deg, var(--purple), #db2777); width: 0%; transition: .25s; }
    .exercise {
      background: linear-gradient(135deg, #fff, #fbf7ff);
      border: 1px solid #f0e6ff;
      border-radius: 24px;
      padding: 16px;
      margin-bottom: 13px;
    }
    .exercise-head { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .num {
      display: inline-flex;
      width: 34px; height: 34px;
      align-items: center; justify-content: center;
      border-radius: 14px;
      background: var(--purple);
      color: white;
      font-weight: 900;
      margin-right: 8px;
    }
    .volume { display: inline-block; color: var(--purple); font-weight: 900; margin: 7px 0; }
    .note { color: var(--muted); font-size: 14px; line-height: 1.45; }
    .counter { background: white; border: 1px solid var(--border); padding: 8px 10px; border-radius: 16px; font-weight: 900; white-space: nowrap; }
    .sets { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
    .set-btn {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 10px 12px;
      border-radius: 16px;
      background: white;
      color: #463957;
      border: 1px solid var(--border);
      font-weight: 800;
    }
    .set-btn.done { background: var(--green); color: white; border-color: var(--green); }
    .check {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid currentColor;
      display: inline-flex; align-items: center; justify-content: center;
      font-size: 12px;
    }
    .timer-card { background: linear-gradient(135deg, #f5edff, #fff0fb); border-radius: 24px; padding: 18px; border: 1px solid var(--border); }
    .timer-label { font-size: 14px; color: var(--purple); font-weight: 900; }
    .timer { font-size: 52px; font-weight: 950; letter-spacing: -2px; margin: 6px 0 12px; }
    .btn-row { display: flex; flex-wrap: wrap; gap: 8px; }
    .btn {
      padding: 11px 14px;
      border-radius: 16px;
      font-weight: 900;
      color: white;
      background: var(--purple);
    }
    .btn.secondary { background: white; color: var(--purple); border: 1px solid var(--border); }
    .btn.green { background: var(--green); }
    .btn.yellow { background: var(--yellow); }
    .btn.red { background: var(--red); }
    .side-box { margin-top: 15px; }
    .tip {
      display: flex; gap: 10px;
      background: var(--soft2);
      border-radius: 18px;
      padding: 12px;
      margin-top: 10px;
      color: #564c69;
      line-height: 1.4;
    }
    .tip span { width: 26px; height: 26px; background: var(--purple); color: white; border-radius: 11px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; font-weight: 900; }
    .hidden { display: none; }
    .calendar-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
    .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
    .dow { text-align: center; color: #9a8daf; font-weight: 900; font-size: 12px; text-transform: uppercase; }
    .day {
      min-height: 95px;
      border-radius: 20px;
      padding: 10px;
      background: white;
      border: 1px solid #eee5ff;
      text-align: left;
    }
    .day.other { opacity: .38; }
    .day.selected { outline: 3px solid #d8b4fe; border-color: var(--purple); background: #faf5ff; }
    .day-top { display: flex; justify-content: space-between; align-items: center; gap: 5px; }
    .day-num { font-weight: 950; font-size: 18px; }
    .mark { border-radius: 999px; padding: 3px 8px; font-size: 12px; font-weight: 950; }
    .mark.done { background: #dcfce7; color: #15803d; }
    .mark.partial { background: #fef3c7; color: #b45309; }
    .mark.missed { background: #ffe4e6; color: #be123c; }
    .day-title { margin-top: 8px; font-size: 12px; font-weight: 900; color: #625776; }
    .day-sub { margin-top: 2px; font-size: 11px; color: #9a8daf; line-height: 1.25; }
    .plan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .plan-day { overflow: hidden; padding: 0; }
    .plan-title { padding: 18px; color: white; background: linear-gradient(135deg, #7c3aed, #db2777); }
    .plan-list { padding: 10px 18px 18px; }
    .plan-row { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 12px 0; border-bottom: 1px solid #f1e8ff; }
    .pill { background: var(--soft2); color: var(--purple); border-radius: 999px; padding: 8px 10px; font-weight: 900; white-space: nowrap; }
    .form-grid { grid-template-columns: repeat(2, 1fr); }
    .history-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 11px; border-bottom: 1px solid #f1e8ff; }
    .history-head { background: var(--soft2); color: var(--purple); font-weight: 900; border-radius: 18px 18px 0 0; }
    .small { font-size: 13px; }
    @media (max-width: 900px) {
      .layout, .plan-grid { grid-template-columns: 1fr; }
      .stats { grid-template-columns: 1fr; }
      .tabs { grid-template-columns: repeat(4, 1fr); }
      .tab { font-size: 0; }
      .tab::first-letter { font-size: 16px; }
      .cal-grid { gap: 5px; }
      .day { min-height: 82px; padding: 8px; }
      .day-sub { display: none; }
      .history-row { grid-template-columns: repeat(2, 1fr); }
      .history-head { display: none; }
    }


    /* Mobile-first dark adaptation */
    html { scroll-behavior: smooth; }
    button, input, textarea { color: var(--text); }
    input, textarea { color-scheme: dark; }
    .wrap { max-width: 1180px; margin: 0 auto; padding: 12px; padding-bottom: 92px; }
    .hero {
      background: linear-gradient(135deg, #342066, #11101c 52%, #3b132c);
      border: 1px solid rgba(192, 132, 252, .28);
      border-radius: 24px;
      padding: 18px;
    }
    .badge { background: rgba(255,255,255,.10); }
    h1 { font-size: clamp(28px, 9vw, 54px); }
    h2 { font-size: clamp(22px, 6vw, 30px); }
    .hero p { font-size: 14px; }
    .tabs {
      position: fixed;
      left: 10px;
      right: 10px;
      bottom: 10px;
      top: auto;
      margin: 0;
      z-index: 30;
      background: rgba(20, 17, 31, .88);
      border-color: rgba(192, 132, 252, .28);
      box-shadow: 0 12px 34px rgba(0,0,0,.45);
    }
    .tab {
      min-height: 48px;
      padding: 10px 6px;
      color: #d8cef0;
      font-size: 12px;
      border: 1px solid transparent;
    }
    .tab.active { background: linear-gradient(135deg, var(--purple), var(--accent)); color: white; }
    .layout, .plan-grid, .form-grid { grid-template-columns: 1fr; }
    .card {
      background: rgba(20, 17, 31, .92);
      border-color: var(--border);
      border-radius: 24px;
      padding: 14px;
    }
    .topline { gap: 10px; }
    .date-input, .field, textarea {
      background: var(--soft2);
      border-color: var(--border);
      color: var(--text);
    }
    .date-input { width: 100%; }
    .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 14px 0; }
    .stat {
      background: var(--card2);
      border-color: var(--border);
      border-radius: 18px;
      padding: 10px;
      min-width: 0;
    }
    .stat b { font-size: 20px; line-height: 1.05; word-break: break-word; }
    .bar { background: #211a33; }
    .bar > div { background: linear-gradient(90deg, var(--purple), var(--accent)); }
    .exercise {
      background: linear-gradient(135deg, #171323, #11101a);
      border-color: var(--border);
      border-radius: 22px;
      padding: 13px;
    }
    .exercise-head { align-items: flex-start; }
    .num { background: linear-gradient(135deg, var(--purple), var(--accent)); }
    .volume { color: #c4b5fd; }
    .counter, .set-btn {
      background: var(--soft2);
      color: #eee7ff;
      border-color: var(--border);
    }
    .sets { gap: 8px; }
    .set-btn {
      flex: 1 1 calc(50% - 8px);
      justify-content: center;
      min-height: 44px;
      padding: 10px;
    }
    .set-btn.done { background: var(--green); color: white; border-color: var(--green); }
    .timer-panel { order: -1; }
    .timer-card {
      background: linear-gradient(135deg, rgba(139,92,246,.20), rgba(236,72,153,.12));
      border-color: rgba(192, 132, 252, .28);
      border-radius: 22px;
      padding: 16px;
    }
    .timer-top .timer-card {
      background: transparent;
      border: 0;
      padding: 0;
    }
    .timer-label { color: #c4b5fd; }
    .timer { font-size: clamp(44px, 15vw, 64px); color: #ffffff; }
    .btn { min-height: 44px; background: linear-gradient(135deg, var(--purple), var(--accent)); }
    .btn.secondary {
      background: var(--soft2);
      color: #ddd6fe;
      border: 1px solid var(--border);
    }
    .btn-row .btn { flex: 1 1 auto; }
    .status-row .btn { flex: 1 1 30%; }
    .tip {
      background: var(--soft2);
      color: #d7cde8;
      border: 1px solid var(--border);
    }
    .tip span { background: linear-gradient(135deg, var(--purple), var(--accent)); }
    .calendar-head { align-items: stretch; }
    .calendar-head .btn-row { width: 100%; }
    .calendar-head .btn-row .btn { flex: 1; }
    .cal-grid { gap: 5px; }
    .dow { color: #c4b5fd; }
    .day {
      min-height: 76px;
      background: var(--card2);
      border-color: var(--border);
      color: var(--text);
      border-radius: 16px;
      padding: 8px;
    }
    .day.other {
      opacity: .62;
      background: #11101a;
      border-style: dashed;
    }
    .day.selected {
      outline: 2px solid var(--purple2);
      border-color: var(--purple2);
      background: #211936;
    }
    .day-title { color: #ddd6fe; }
    .day-sub { color: var(--muted); }
    .mark.done { background: rgba(34,197,94,.16); color: #86efac; }
    .mark.partial { background: rgba(245,158,11,.16); color: #fcd34d; }
    .mark.missed { background: rgba(239,68,68,.16); color: #fca5a5; }
    .plan-title { background: linear-gradient(135deg, var(--purple), var(--accent)); }
    .plan-row { border-bottom-color: var(--border); }
    .pill { background: var(--soft2); color: #c4b5fd; }
    .history-row { grid-template-columns: repeat(2, 1fr); border-bottom-color: var(--border); }
    .history-head { display: none; background: var(--soft2); color: #c4b5fd; }
    .small { font-size: 12px; }

    @media (max-width: 420px) {
      .wrap { padding-left: 10px; padding-right: 10px; }
      .hero { padding: 16px; }
      .card { padding: 12px; }
      .stats { grid-template-columns: 1fr; }
      .set-btn { flex-basis: 100%; }
      .day { min-height: 60px; padding: 6px; }
      .day-title, .day-sub { display: none; }
      .day-num { font-size: 16px; }
      .mark { padding: 2px 6px; font-size: 11px; }
      .tab { font-size: 11px; }
    }

    @media (min-width: 901px) {
      .wrap { padding: 22px; }
      .tabs {
        position: sticky;
        top: 10px;
        bottom: auto;
        left: auto;
        right: auto;
        margin: 18px 0;
      }
      .tab { font-size: 16px; padding: 13px 10px; }
      .layout { grid-template-columns: minmax(0, 1fr) 340px; align-items: start; }
      .plan-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .form-grid { grid-template-columns: repeat(2, 1fr); }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 18px; }
      .stat { padding: 14px; }
      .stat b { font-size: 28px; }
      .card { padding: 20px; border-radius: 30px; }
      .hero { padding: 28px; border-radius: 32px; }
      .date-input { width: auto; }
      .day { min-height: 95px; border-radius: 20px; padding: 10px; }
      .calendar-head .btn-row { width: auto; }
      .history-row { grid-template-columns: repeat(5, 1fr); }
      .history-head { display: grid; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="hero">
      <div class="badge">🏠 Домашний фитнес-трекер</div>
      <h1>План похудения и отжиманий</h1>
      <p>Отмечай тренировки, запускай день, закрывай подходы галочками и отдыхай по таймеру. Всё сохраняется прямо в браузере.</p>
    </header>

    <nav class="tabs">
      <button class="tab active" data-tab="today">▶ Сегодня</button>
      <button class="tab" data-tab="calendar">✓ Календарь</button>
      <button class="tab" data-tab="plan">▦ План</button>
      <button class="tab" data-tab="progress">↗ Прогресс</button>
    </nav>

    <section id="today" class="tab-page"></section>
    <section id="calendar" class="tab-page hidden"></section>
    <section id="plan" class="tab-page hidden"></section>
    <section id="progress" class="tab-page hidden"></section>
  </div>

<script>
const REST_DEFAULT = 75;

const workouts = {
  1: { key: "monday", title: "Понедельник", subtitle: "Силовая A + кардио", focus: "Отжимания, верх тела, ноги, пресс", blocks: [

    s("Обычные отжимания", "4×2", "Не до отказа, техника важнее количества.", 4, "2"),

    s("Приседания с рюкзаком", "4×12–15", "Рюкзак 3–5 кг, держать у груди или на спине.", 4, "12–15"),
    s("Ягодичный мост", "4×18–25", "Можно без веса первую неделю, затем рюкзак на таз или одна нога.", 4, "18–25"),
    s("Тяга рюкзака в наклоне", "4×12–15", "Спина ровная, тянуть локтями назад.", 4, "12–15"),
    s("Планка", "3×25–35 сек", "Корпус одной линией.", 3, "25–35 сек"),
    b("Кардио", "7:30", "5 раундов: 1 мин интенсивно / 30 сек легко.", "time", 1)
  ]},
  2: { key: "tuesday", title: "Вторник", subtitle: "Кардио + легкие отжимания + пресс", focus: "Кардио, легкие отжимания, пресс", blocks: [
    b("Кардио утром/днем", "7:30", "Не обязательно максимум, главное сделать.", "time", 1),
    b("Кардио вечером", "7:30", "Если ноги/дыхание убиты — пропусти вечерний блок.", "time", 1),

    s("Выпады назад", "3×8 на ногу", "Начни без веса. Шаг назад + опускание вниз + возврат.", 3, "8/нога"),
    s("Румынская тяга с рюкзаком", "4×12–15", "Для задней поверхности бедра и ягодиц.", 4, "12–15"),
    s("Болгарские выпады", "3×6–8 на ногу", "Если слишком тяжело — замени на выпады назад.", 3, "6–8/нога"),
    s("Ягодичный мост одной ногой", "3×8–10 на ногу", "Хорошая замена весу, если рюкзак неудобно класть.", 3, "8–10/нога"),
    s("Тяга рюкзака одной рукой", "4×10–12 на сторону", "Колено/рука могут опираться на стул/кровать.", 4, "10–12/сторона"),
    s("Подъемы гантелей в стороны", "3×12–15", "2 кг хватит, если делать медленно.", 3, "12–15"),
    s("Боковая планка", "3×20–30 сек на сторону", "Без перекоса корпуса.", 3, "20–30 сек/сторона"),
    b("Кардио", "7:30", "Легче, чем в понедельник.", "time", 1)
  ]},
  4: { key: "thursday", title: "Четверг", subtitle: "Кардио-день + отжимания", focus: "Два коротких кардио-блока и отжимания-навык", blocks: [
    b("Кардио 1", "7:30", "Первый короткий блок.", "time", 1),
    b("Кардио 2", "7:30", "Лучше два коротких блока, чем один неприятный длинный.", "time", 1),
    s("Отжимания-навык", "6×2", "Если техника плохая: 3 подхода обычных + 3 подхода наклонных.", 6, "2"),
    b("Растяжка", "7–10 минут", "Грудь, плечи, бедра, ягодицы, икры, спина. Без боли.", "time", 1)
  ]},
  5: { key: "friday", title: "Пятница", subtitle: "Силовая C, главный день отжиманий + кардио", focus: "Главный день отжиманий", blocks: [
    b("Разминка", "7 минут", "Плечи, запястья, грудь, легкие наклонные отжимания.", "time", 1),
    c("Лесенка отжиманий", "1–2–3–2–1", "Если 3 ломает технику: 1–2–2–2–1.", ["1", "2", "3", "2", "1"]),
    s("Негативные отжимания", "3×3", "Медленное опускание.", 3, "3"),
    s("Отжимания с колен", "3×6–10", "Добор объема.", 3, "6–10"),
    s("Наклонные отжимания", "3×8–12", "Чисто, без провала поясницы.", 3, "8–12"),
    s("Тяга рюкзака в наклоне", "4×12–15", "Компенсация нагрузки на грудь: нужна спина.", 4, "12–15"),
    s("Жим гантелей вверх", "3×12–15", "Плечи, пресс напряжен.", 3, "12–15"),
    s("Приседания с рюкзаком", "3×12–15", "Не до полного отказа.", 3, "12–15"),
    s("Планка", "3×30 сек", "Ровный корпус.", 3, "30 сек"),
    b("Кардио", "7:30", "После отдыха 3–7 минут.", "time", 1)
  ]},
  6: { key: "saturday", title: "Суббота", subtitle: "Силовая D + кардио", focus: "Все тело с акцентом на ноги/ягодицы/живот", blocks: [
    b("Разминка", "6 минут", "Легкий разогрев всего тела.", "time", 1),
    s("Приседания с рюкзаком", "4×15", "Рюкзак 3–5 кг.", 4, "15"),
    s("Выпады назад", "3×8–10 на ногу", "Если сложно, делай меньше повторов, но чисто.", 3, "8–10/нога"),
    s("Румынская тяга с рюкзаком", "4×12–15", "Спина ровная, движение от таза.", 4, "12–15"),
    s("Ягодичный мост", "3×20", "Вверху пауза 1 секунда.", 3, "20"),
    s("Наклонные отжимания", "3×8–12", "Не максимум, просто объем.", 3, "8–12"),
    s("Тяга рюкзака одной рукой", "3×12 на сторону", "Спина и осанка.", 3, "12/сторона"),
    s("Скручивания", "3×15", "Лопатки от пола, шея расслаблена.", 3, "15"),
    s("Dead bug", "3×10 на сторону", "Медленно.", 3, "10/сторона"),
    b("Кардио", "7:30 + вечером 7:30", "Второй блок только если восстановление нормальное.", "time", 1)
  ]},
  0: { key: "sunday", title: "Воскресенье", subtitle: "Восстановление + контроль результата", focus: "Замеры, фото, отдых, легкая растяжка", blocks: [
    b("Вес", "утром", "После туалета. Смотреть среднее за неделю, а не один день.", "check", 1),
    b("Замеры", "1 раз в неделю", "Талия, живот на уровне пупка, низ живота, бедра, бедро, рука.", "check", 1),
    b("Фото", "1 раз в 2 недели", "Одинаковый свет, одежда, поза: спереди/сбоку/сзади.", "check", 1),
    b("Растяжка", "8–10 минут", "Легко, без боли и без цели сесть на шпагат.", "time", 1)
  ]}
};

function b(name, volume, note, type, count) { return { name, volume, note, type, count }; }
function s(name, volume, note, sets, reps) { return { name, volume, note, type: "sets", sets, reps }; }
function c(name, volume, note, labels) { return { name, volume, note, type: "custom", labels }; }
function pad(n) { return String(n).padStart(2, "0"); }
function todayKey() { return dateKey(new Date()); }
function dateKey(d) { return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function fromKey(key) { const [y,m,d] = key.split("-").map(Number); return new Date(y,m-1,d); }
function workoutForDateKey(key) { return workouts[fromKey(key).getDay()]; }
function save(name, value) { localStorage.setItem(name, JSON.stringify(value)); }
function load(name, fallback) { try { return JSON.parse(localStorage.getItem(name)) ?? fallback; } catch { return fallback; } }
function esc(s) { return String(s).replace(/[&<>"]/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;"}[m])); }

let state = {
  tab: "today",
  selectedDate: todayKey(),
  calendarMonth: new Date(new Date().getFullYear(), new Date().getMonth(), 1),
  records: load("wt_records", {}),
  sessions: load("wt_sessions", {}),
  metrics: load("wt_metrics", []),
  timerSeconds: REST_DEFAULT,
  timerRunning: false,
  timerInterval: null
};

function setTab(tab) {
  state.tab = tab;
  document.querySelectorAll(".tab").forEach(btn => btn.classList.toggle("active", btn.dataset.tab === tab));
  document.querySelectorAll(".tab-page").forEach(page => page.classList.toggle("hidden", page.id !== tab));
  render();
}

document.querySelectorAll(".tab").forEach(btn => btn.addEventListener("click", () => setTab(btn.dataset.tab)));

function getLabels(block) {
  if (block.type === "custom") return block.labels;
  if (block.type === "sets") return Array.from({length: block.sets}, () => block.reps);
  return [block.volume];
}

function sessionKey() {
  const w = workoutForDateKey(state.selectedDate);
  return `${state.selectedDate}:${w.key}`;
}

function currentSession() {
  return state.sessions[sessionKey()] || {};
}

function completion() {
  const w = workoutForDateKey(state.selectedDate);
  const sess = currentSession();
  let total = 0, done = 0;
  w.blocks.forEach((block, bi) => {
    const labels = getLabels(block);
    total += labels.length;
    labels.forEach((_, si) => { if (sess[`${bi}-${si}`]) done++; });
  });
  return { total, done, percent: total ? Math.round(done / total * 100) : 0 };
}

function startTimer(sec = REST_DEFAULT) {
  state.timerSeconds = sec;
  state.timerRunning = true;
  clearInterval(state.timerInterval);
  state.timerInterval = setInterval(() => {
    if (!state.timerRunning) return;
    state.timerSeconds--;
    if (state.timerSeconds <= 0) {
      state.timerSeconds = 0;
      state.timerRunning = false;
      clearInterval(state.timerInterval);
    }
    updateTimerOnly();
  }, 1000);
  updateTimerOnly();
}

function pauseTimer() {
  state.timerRunning = false;
  clearInterval(state.timerInterval);
  updateTimerOnly();
}

function resetTimer(sec = REST_DEFAULT) {
  pauseTimer();
  state.timerSeconds = sec;
  updateTimerOnly();
}

function updateTimerOnly() {
  const el = document.querySelector("#timerText");
  const btn = document.querySelector("#timerStartBtn");
  if (el) el.textContent = `${pad(Math.floor(state.timerSeconds/60))}:${pad(state.timerSeconds%60)}`;
  if (btn) btn.textContent = state.timerRunning ? "Пауза" : "Старт";
}

function toggleSet(bi, si) {
  const sk = sessionKey();
  const sess = { ...(state.sessions[sk] || {}) };
  const key = `${bi}-${si}`;
  const was = !!sess[key];
  sess[key] = !was;
  state.sessions[sk] = sess;
  save("wt_sessions", state.sessions);
  if (!was) startTimer(REST_DEFAULT);
  renderToday();
}

function setStatus(status) {
  const comp = completion();
  state.records[state.selectedDate] = { status, completion: comp, updatedAt: new Date().toISOString() };
  save("wt_records", state.records);
  render();
}

function resetDay() {
  delete state.sessions[sessionKey()];
  save("wt_sessions", state.sessions);
  pauseTimer();
  state.timerSeconds = REST_DEFAULT;
  renderToday();
}

function renderToday() {
  const page = document.getElementById("today");
  const d = fromKey(state.selectedDate);
  const w = workoutForDateKey(state.selectedDate);
  const comp = completion();
  const rec = state.records[state.selectedDate]?.status || "none";
  const sess = currentSession();
  const statusText = rec === "done" ? "Готово" : rec === "partial" ? "Частично" : rec === "missed" ? "Пропуск" : "Не отмечено";
  page.innerHTML = `
    <div class="grid layout today-layout">
      <div class="grid today-main">
        <div class="card timer-panel">
          <div class="timer-top">${renderTimer()}</div>
          <div class="btn-row status-row" style="margin-top:14px;">
            <button class="btn green" onclick="setStatus('done')">Сделано</button>
            <button class="btn yellow" onclick="setStatus('partial')">Частично</button>
            <button class="btn red" onclick="setStatus('missed')">Пропуск</button>
          </div>
          <button class="btn secondary" style="width:100%;margin-top:10px;" onclick="resetDay()">Сбросить галочки за день</button>
        </div>

        <div class="card">
          <div class="topline">
            <div>
              <div class="muted" style="font-weight:900;text-transform:uppercase;letter-spacing:.08em;">${d.toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long"})}</div>
              <h2>${w.title}: ${w.subtitle}</h2>
              <p class="muted">${w.focus}</p>
            </div>
            <input class="date-input" type="date" value="${state.selectedDate}" onchange="changeDate(this.value)">
          </div>
          <div class="grid stats">
            <div class="stat"><span class="muted">Выполнено</span><b>${comp.done}/${comp.total}</b><span class="muted small">${comp.percent}% тренировки</span></div>
            <div class="stat"><span class="muted">Статус дня</span><b>${statusText}</b><span class="muted small">можно менять вручную</span></div>
            <div class="stat"><span class="muted">Отдых</span><b>${REST_DEFAULT} сек</b><span class="muted small">после галочки запускается таймер</span></div>
          </div>
          <div class="bar"><div style="width:${comp.percent}%"></div></div>
          <div>${w.blocks.map((block, bi) => renderExercise(block, bi, sess)).join("")}</div>
        </div>
      </div>
      <aside>
        <div class="card side-box" style="margin-top:0;">
          <h3>Мини-правила</h3>
          ${["Если все подходы чистые и есть запас — усложни только один параметр.", "Сначала добавляй повторы, потом вес рюкзака, потом темп.", "Максимум отжиманий проверяй 1 раз в неделю.", "Если техника плывет — не повышай нагрузку."].map((t,i)=>`<div class="tip"><span>${i+1}</span><div>${t}</div></div>`).join("")}
        </div>
      </aside>
    </div>`;
  updateTimerOnly();
}

function renderExercise(block, bi, sess) {
  const labels = getLabels(block);
  const done = labels.filter((_, si) => sess[`${bi}-${si}`]).length;
  return `<article class="exercise">
    <div class="exercise-head">
      <div>
        <h3><span class="num">${bi+1}</span>${esc(block.name)}</h3>
        <div class="volume">${esc(block.volume)}</div>
        <div class="note">${esc(block.note)}</div>
      </div>
      <div class="counter">${done}/${labels.length}</div>
    </div>
    <div class="sets">
      ${labels.map((label, si) => {
        const isDone = sess[`${bi}-${si}`];
        const text = block.type === "sets" || block.type === "custom" ? `Подход ${si+1}: ${label}` : label;
        return `<button class="set-btn ${isDone ? "done" : ""}" onclick="toggleSet(${bi},${si})"><span class="check">✓</span>${esc(text)}</button>`;
      }).join("")}
    </div>
  </article>`;
}

function renderTimer() {
  return `<div class="timer-card">
    <div class="timer-label">Таймер отдыха</div>
    <div class="timer" id="timerText">${pad(Math.floor(state.timerSeconds/60))}:${pad(state.timerSeconds%60)}</div>
    <div class="btn-row">
      <button class="btn" id="timerStartBtn" onclick="state.timerRunning ? pauseTimer() : startTimer(state.timerSeconds || REST_DEFAULT)">${state.timerRunning ? "Пауза" : "Старт"}</button>
      <button class="btn secondary" onclick="resetTimer()">Сброс</button>
    </div>
    <div class="btn-row" style="margin-top:10px;">
      ${[45,60,75,90,120].map(s=>`<button class="btn secondary" onclick="resetTimer(${s})">${s} сек</button>`).join("")}
    </div>
  </div>`;
}

function changeDate(value) {
  state.selectedDate = value;
  renderToday();
}

function renderCalendar() {
  const page = document.getElementById("calendar");
  const cm = state.calendarMonth;
  const first = new Date(cm.getFullYear(), cm.getMonth(), 1);
  const offset = (first.getDay() + 6) % 7;
  const start = new Date(cm.getFullYear(), cm.getMonth(), 1 - offset);
  const days = [];
  for (let i=0; i<42; i++) { const d = new Date(start); d.setDate(start.getDate()+i); days.push(d); }
  page.innerHTML = `<div class="card">
    <div class="calendar-head">
      <div><h2>Календарь тренировок</h2><p class="muted">Нажми на день, чтобы открыть его тренировку. Серые даты — соседний месяц; стрелка вправо откроет июнь, июль и дальше.</p></div>
      <div class="btn-row">
        <button class="btn secondary" onclick="moveMonth(-1)">←</button>
        <button class="btn secondary">${cm.toLocaleDateString("ru-RU", {month:"long", year:"numeric"})}</button>
        <button class="btn secondary" onclick="moveMonth(1)">→</button>
      </div>
    </div>
    <div class="cal-grid">${["Пн","Вт","Ср","Чт","Пт","Сб","Вс"].map(x=>`<div class="dow">${x}</div>`).join("")}</div>
    <div class="cal-grid" style="margin-top:8px;">${days.map(renderDay).join("")}</div>
  </div>`;
}

function renderDay(d) {
  const key = dateKey(d);
  const rec = state.records[key]?.status;
  const w = workoutForDateKey(key);
  const other = d.getMonth() !== state.calendarMonth.getMonth();
  const mark = rec ? `<span class="mark ${rec}">${rec === "done" ? "✓" : rec === "partial" ? "~" : "×"}</span>` : `<span></span>`;
  return `<button class="day ${other ? "other" : ""} ${key === state.selectedDate ? "selected" : ""}" onclick="openDay('${key}')">
    <div class="day-top"><span class="day-num">${d.getDate()}</span>${mark}</div>
    <div class="day-title">${w.title}</div>
    <div class="day-sub">${w.subtitle}</div>
  </button>`;
}
function moveMonth(delta) { state.calendarMonth = new Date(state.calendarMonth.getFullYear(), state.calendarMonth.getMonth()+delta, 1); renderCalendar(); }
function openDay(key) { state.selectedDate = key; setTab("today"); }

function renderPlan() {
  const page = document.getElementById("plan");
  const order = [1,2,3,4,5,6,0];
  page.innerHTML = `<div class="grid plan-grid">${order.map(day => {
    const w = workouts[day];
    return `<div class="card plan-day">
      <div class="plan-title"><h2>${w.title}</h2><div>${w.subtitle}</div></div>
      <div class="plan-list">${w.blocks.map(block => `<div class="plan-row"><div><b>${esc(block.name)}</b><div class="muted small">${esc(block.note)}</div></div><div class="pill">${esc(block.volume)}</div></div>`).join("")}</div>
    </div>`;
  }).join("")}</div>`;
}

function renderProgress() {
  const page = document.getElementById("progress");
  page.innerHTML = `<div class="grid layout">
    <div class="card">
      <h2>Замеры и результат</h2>
      <p class="muted">Записывай вес, талию, живот и максимум отжиманий. Так результат будет видно, даже когда весы тупят.</p>
      <form onsubmit="addMetric(event)" class="grid" style="margin-top:18px;">
        <input class="field" name="date" type="date" value="${state.selectedDate}">
        <div class="grid form-grid">
          <input class="field" name="weight" placeholder="Вес, кг">
          <input class="field" name="waist" placeholder="Талия, см">
          <input class="field" name="belly" placeholder="Живот, см">
          <input class="field" name="pushups" placeholder="Отжимания max">
        </div>
        <textarea name="note" placeholder="Заметка: сон, усталость, настроение..."></textarea>
        <button class="btn" type="submit">Добавить запись</button>
      </form>
    </div>
    <div class="card">
      <h2>История</h2>
      <div style="margin-top:14px; overflow:hidden; border:1px solid var(--border); border-radius:20px;">
        <div class="history-row history-head"><div>Дата</div><div>Вес</div><div>Талия</div><div>Живот</div><div>Отжимания</div></div>
        ${state.metrics.length ? state.metrics.map(m => `<div class="history-row"><div><b>${esc(m.date)}</b></div><div>${esc(m.weight||"—")}</div><div>${esc(m.waist||"—")}</div><div>${esc(m.belly||"—")}</div><div>${esc(m.pushups||"—")}</div>${m.note ? `<div style="grid-column:1/-1" class="muted small">${esc(m.note)}</div>` : ""}</div>`).join("") : `<div style="padding:22px;text-align:center;" class="muted">Пока записей нет</div>`}
      </div>
    </div>
  </div>`;
}

function addMetric(e) {
  e.preventDefault();
  const f = new FormData(e.target);
  state.metrics.unshift({ id: Date.now(), date: f.get("date"), weight: f.get("weight"), waist: f.get("waist"), belly: f.get("belly"), pushups: f.get("pushups"), note: f.get("note") });
  state.metrics = state.metrics.slice(0, 40);
  save("wt_metrics", state.metrics);
  e.target.reset();
  renderProgress();
}

function render() {
  if (state.tab === "today") renderToday();
  if (state.tab === "calendar") renderCalendar();
  if (state.tab === "plan") renderPlan();
  if (state.tab === "progress") renderProgress();
}

window.toggleSet = toggleSet;
window.setStatus = setStatus;
window.resetDay = resetDay;
window.changeDate = changeDate;
window.state = state;
window.startTimer = startTimer;
window.pauseTimer = pauseTimer;
window.resetTimer = resetTimer;
window.moveMonth = moveMonth;
window.openDay = openDay;
window.addMetric = addMetric;

renderToday();
</script>
</body>
</html>
